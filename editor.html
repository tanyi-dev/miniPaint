	<script>
		// 自动清理与自适应语言嗅探
		(function () {
			// 1. 若检测到旧的损坏 Cookie（带编码字符 %7B 等），立即自动清除并重写，防止普通模式老访客报错
			var match = document.cookie.match(/(?:^|;\s*)config=([^;]+)/);
			if (match && match[1]) {
				var rawVal = match[1];
				try {
					JSON.parse(rawVal);
				} catch (e) {
					// 旧 Cookie 已损坏，先清除
					document.cookie = "config=;path=/;SameSite=Lax;Secure;expires=Thu, 01 Jan 1970 00:00:00 GMT";
					try {
						// 尝试解码并修复，或直接设为正常中文
						var fixed = JSON.stringify(JSON.parse(decodeURIComponent(rawVal)));
						var d = new Date();
						d.setTime(d.getTime() + (180 * 24 * 60 * 60 * 1000));
						document.cookie = "config=" + fixed + ";path=/;SameSite=Lax;Secure;expires=" + d.toUTCString();
					} catch (err) {
						var d = new Date();
						d.setTime(d.getTime() + (180 * 24 * 60 * 60 * 1000));
						document.cookie = "config=" + JSON.stringify({ language: 'zh' }) + ";path=/;SameSite=Lax;Secure;expires=" + d.toUTCString();
					}
				}
			}

			// 2. 新访客：若未设置语言，且首选为中文，默认设为中文环境
			if (document.cookie.indexOf('config=') === -1 && window.location.search.indexOf('lang=') === -1) {
				var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
				if (lang.indexOf('zh') !== -1) {
					var d = new Date();
					d.setTime(d.getTime() + (180 * 24 * 60 * 60 * 1000));
					document.cookie = "config=" + JSON.stringify({ language: 'zh' }) + ";path=/;SameSite=Lax;Secure;expires=" + d.toUTCString();
				}
			}
		})();
	</script>

				if ((m = msg.match(/^Tools class not found:\s*(.*)$/))) return '未找到工具类：' + m[1];
				if ((m = msg.match(/^Modules class not found:\s*(.*)$/))) return '未找到模块类：' + m[1];
				if ((m = msg.match(/^Module function not found\.\s*(.*)$/))) return '未找到模块功能：' + m[1];
				if ((m = msg.match(/^Translate error, can not find dictionary:\s*(.*)$/))) return '翻译错误，找不到语言字典：' + m[1];
				if ((m = msg.match(/^Size is too big, max (.*) pixels\.$/))) return '尺寸过大，最大限制为 ' + m[1] + ' 像素。';
				if ((m = msg.match(/^Size is too big, max (.*) bytes\.$/))) return '尺寸过大，最大限制为 ' + m[1] + ' 字节。';
				if ((m = msg.match(/^Sorry, cold not load getUserMedia\(\) data:\s*(.*)$/))) return '抱歉，无法获取 getUserMedia() 摄像头数据：' + m[1];
				if ((m = msg.match(/^Font (.*) could not be loaded\.$/))) return '字体 ' + m[1] + ' 无法加载。';
				if ((m = msg.match(/^key points:\s*(\d+)$/))) return '关键点数：' + m[1];
				if ((m = msg.match(/^(\d+)\s*layer\(s\) were skipped\.$/))) return '已跳过 ' + m[1] + ' 个图层。';
				if ((m = msg.match(/^Crop on rotated layer is not supported\. Convert it to raster to continue\.\((.*)\)$/))) return '不支持旋转图层上的裁剪。请将其转换为位图以继续。(' + m[1] + ')';
				return msg;
			};
		})();
	</script>

				var isZh = false;
				// 1. 优先读取 URL 参数 ?lang=
				var urlMatch = window.location.search.match(/[?&]lang=([^&]+)/i);
				if (urlMatch) {
					isZh = (urlMatch[1].toLowerCase().indexOf("zh") === 0);
				} else if (window.config && window.config.LANG) {
					isZh = (window.config.LANG === "zh");
				} else {
					// 2. 检查 index_lang / config Cookie
					var indexCookie = document.cookie.match(/(?:^|; )index_lang=([^;]*)/);
					if (indexCookie) {
						isZh = (indexCookie[1] === "zh");
					} else if (document.cookie.indexOf("language=zh") !== -1 || document.cookie.indexOf("%22zh%22") !== -1 || document.cookie.indexOf('"zh"') !== -1) {
						isZh = true;
					} else if (document.cookie.indexOf("config=") === -1 && /^zh\b/i.test(navigator.language || "")) {
						isZh = true;
					}

				var privacyTxt = document.getElementById('footer_privacy_txt');

					if (termsTxt) termsTxt.innerText = '服务条款';
					if (galleryTxt) {

						document.getElementById('footer_link_gallery').setAttribute('href', 'zh/gallery');

					if (donateEl) donateEl.innerText = '☕ 赞助支持';
				} else {

					var homeBtnEn = document.getElementById('top_nav_home_btn');

	<script>
		// 画廊模板自动加载：gallery 页通过 ?load=/images/gallery/xxx.jpg 传入示例图
		// 安全约束：仅允许本站 /images/gallery/ 目录下的 .jpg，防止被当作任意图片加载代理
		// 性能要点：脚本在解析时立即并行预取图片（与 bundle 下载/启动同时进行），
		// 随后用细粒度轮询等待 FileOpen 与导入对话框就绪，替代固定延时。
		(function () {
			var m = window.location.search.match(/[?&]load=([^&]+)/i);
			if (!m) return;
			var path;
			try { path = decodeURIComponent(m[1]); } catch (e) { return; }
			if (!/^\/images\/gallery\/[a-z0-9-]+\.jpg$/i.test(path)) return;
			if (window.__galleryTemplateLoaded) return;
			window.__galleryTemplateLoaded = true;

			// 1) 立即预取图片并转 dataURL（不等待编辑器启动完成）
			var fetchP = fetch(path, { cache: 'force-cache' })
				.then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
				.then(function (blob) {
					return new Promise(function (resolve, reject) {
						var fr = new FileReader();
						fr.onload = function () { resolve(fr.result); };
						fr.onerror = reject;
						fr.readAsDataURL(blob);
					});
				});

			function waitFor(ready, interval, timeout, label) {
				return new Promise(function (resolve, reject) {
					var t0 = Date.now();
					(function poll() {
						var v = ready();
						if (v) return resolve(v);
						if (Date.now() - t0 > timeout) return reject(new Error('timeout: ' + label));
						setTimeout(poll, interval);
					})();
				});
			}

			function clickOk() {
				var btns = document.querySelectorAll('.popup button');
				for (var i = 0; i < btns.length; i++) {
					var t = (btns[i].textContent || '').trim();
					if (/^(ok|确定|好)$/i.test(t)) { btns[i].click(); return true; }
				}
				return false;
			}

			// 2) 并行等待「图片就绪」和「编辑器 FileOpen 就绪」
			Promise.all([
				fetchP,
				waitFor(function () {
					return window.FileOpen && typeof window.FileOpen.open_data_url === 'function';
				}, 100, 30000, 'FileOpen')
			])
				.then(function (res) {
					var du = res[0];
					// 3) 弹出数据导入对话框，并轮询等待其渲染完成（替代固定 800ms）
					window.FileOpen.open_data_url(du, path.split('/').pop());
					return waitFor(function () { return document.querySelector('#pop_data_data'); }, 50, 5000, 'popup')
						.then(function (ta) { return { ta: ta, du: du }; });
				})
				.then(function (ctx) {
					ctx.ta.value = ctx.du;
					ctx.ta.dispatchEvent(new Event('input', { bubbles: true }));
					ctx.ta.dispatchEvent(new Event('change', { bubbles: true }));
					setTimeout(function () { clickOk(); }, 30);
				})
				.catch(function (e) { console.warn('Gallery template load failed:', e); });
		})();
	</script>
