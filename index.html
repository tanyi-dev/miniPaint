	<script>
		// 自动清理与自适应语言嗅探
		(function () {
			// 1. 若检测到旧的损坏 Cookie（带编码字符 %7B 等），立即自动清除并重写，防止普通模式老访客报错
			var match = document.cookie.match(/(?:^|;\s*)config=([^;]+)/);
			if (match && match[1]) {
				var rawVal = match[1];
				try {
					JSON.parse(rawVal);
				} catch (e) {
					// 旧 Cookie 已损坏，先清除
					document.cookie = "config=;path=/;SameSite=Lax;Secure;expires=Thu, 01 Jan 1970 00:00:00 GMT";
					try {
						// 尝试解码并修复，或直接设为正常中文
						var fixed = JSON.stringify(JSON.parse(decodeURIComponent(rawVal)));
						var d = new Date();
						d.setTime(d.getTime() + (180 * 24 * 60 * 60 * 1000));
						document.cookie = "config=" + fixed + ";path=/;SameSite=Lax;Secure;expires=" + d.toUTCString();
					} catch (err) {
						var d = new Date();
						d.setTime(d.getTime() + (180 * 24 * 60 * 60 * 1000));
						document.cookie = "config=" + JSON.stringify({ language: 'zh' }) + ";path=/;SameSite=Lax;Secure;expires=" + d.toUTCString();
					}
				}
			}

			// 2. 新访客：若未设置语言，且首选为中文，默认设为中文环境
			if (document.cookie.indexOf('config=') === -1 && window.location.search.indexOf('lang=') === -1) {
				var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
				if (lang.indexOf('zh') !== -1) {
					var d = new Date();
					d.setTime(d.getTime() + (180 * 24 * 60 * 60 * 1000));
					document.cookie = "config=" + JSON.stringify({ language: 'zh' }) + ";path=/;SameSite=Lax;Secure;expires=" + d.toUTCString();
				}
			}
		})();
	</script>

			<div class="colors block">
				<h2 class="trn toggle" data-target="toggle_colors">Colors</h2>
				<div class="content" id="toggle_colors"></div>
			</div>

			<div class="block" id="info_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_info">Information</h2>

			<div class="details block" id="details_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_details">Layer details</h2>

			<div class="layers block">
				<h2 class="trn">Layers</h2>

		</div>
	</div>
	<div class="mobile_menu">
		<button class="left_mobile_menu" id="left_mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
		<button class="right_mobile_menu" id="mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>

	<div class="hidden" id="tmp"></div>
	<div id="popups"></div>

	<!-- AdSense Compliance Bar: Centered in canvas bottom margin (safe from tools & layers) -->
	<footer id="adsense_compliance_bar"
		style="position: fixed; bottom: 0; left: 0; right: 0; height: 26px; line-height: 26px; z-index: 99; background: #25282a; border-top: 1px solid #383c40; text-align: center; font-size: 11px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
		<span style="color: #777; margin-right: 15px;">&copy; 2026 Web PSEditor (Powered by miniPaint under MIT)</span>
		<a id="footer_link_guide" href="/guide" target="_blank"
			style="color: #4da3ff; text-decoration: none; margin: 0 10px; font-weight: 500;">User Guide</a>
		<span style="color: #444;">|</span>
		<a id="footer_link_privacy" href="/privacy" target="_blank"
			style="color: #aaa; text-decoration: none; margin: 0 10px;">Privacy Policy</a>
		<span style="color: #444;">|</span>
		<a id="footer_link_terms" href="/terms" target="_blank"
			style="color: #aaa; text-decoration: none; margin: 0 10px;">Terms of Service</a>
		<!-- 赞助功能待 Stripe 配置完成后再开启
			<span style="color: #444;">|</span>
		<a id="footer_link_donate" href="https://www.buymeacoffee.com/webpseditor" target="_blank" rel="noopener noreferrer" style="color: #f59e0b; text-decoration: none; margin-left: 10px; font-weight: 500;">☕ Buy Me a Coffee</a>
		-->
	</footer>

	<script>
		// 监听/同步当前界面语言，保持底栏文本与编辑器语言一致
		(function () {
			function updateFooterLanguage() {
				var isZh = false;
				// 检查全局配置或cookie
				if (window.config && window.config.LANG) {
					isZh = (window.config.LANG === 'zh');
				} else if (document.cookie.indexOf('language=zh') !== -1 || document.cookie.indexOf('%22zh%22') !== -1 || document.cookie.indexOf('"zh"') !== -1) {
					isZh = true;
				} else if (document.cookie.indexOf('config=') === -1 && (navigator.language || '').toLowerCase().indexOf('zh') !== -1) {
					isZh = true;
				}

				var guideEl = document.getElementById('footer_link_guide');
				var privacyEl = document.getElementById('footer_link_privacy');
				var termsEl = document.getElementById('footer_link_terms');
				var donateEl = document.getElementById('footer_link_donate');

				if (guideEl && privacyEl && termsEl) {
					if (isZh) {
						guideEl.innerText = '使用教程';
						privacyEl.innerText = '隐私政策';
						termsEl.innerText = '服务条款';
						if (donateEl) donateEl.innerText = '☕ 赞助支持';
					} else {
						guideEl.innerText = 'User Guide';
						privacyEl.innerText = 'Privacy Policy';
						termsEl.innerText = 'Terms of Service';
						if (donateEl) donateEl.innerText = '☕ Buy Me a Coffee';
					}
				}
			}

			// 页面加载和语言切换时同步更新

			// 1. 确保顶部品牌 Bar 插入到 main_menu 最前列（事件驱动 + 单次执行）
			function ensureTopBrandBar() {
				var menu = document.getElementById('main_menu');
				if (!menu) return false;
				if (!document.getElementById('top_brand_bar')) {
					var brand = document.createElement('a');
					brand.id = 'top_brand_bar';
					brand.className = 'top_brand_bar';
					brand.href = '#';
					brand.title = 'Web PSEditor - 在线图片编辑器';
					brand.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="20" height="20" style="vertical-align:middle;display:inline-block;"><defs><linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="24" fill="url(#psBg)"/><path d="M8 32 Q 8 8 32 8 L 120 96 Q 120 120 96 120 Z" fill="rgba(255,255,255,0.12)"/><path d="M34 38 L 56 38 C 66 38 72 43 72 52 C 72 61 66 66 56 66 L 46 66 L 46 90 L 34 90 Z M 46 49 L 46 56 L 55 56 C 58 56 60 54 60 52 C 60 50 58 49 55 49 Z" fill="#ffffff"/><path d="M74 76 C 75 79 78 81 83 81 C 88 81 91 79 91 76 C 91 72 87 70 80 68 C 72 66 65 62 65 53 C 65 44 73 38 83 38 C 93 38 99 43 100 51 L 89 51 C 88 48 86 46 83 46 C 80 46 76 48 76 51 C 76 54 79 56 86 58 C 95 61 102 64 102 73 C 102 83 94 90 83 90 C 71 90 64 84 63 76 Z" fill="#38bdf8"/><polygon points="102,26 105,32 111,35 105,38 102,44 99,38 93,35 99,32" fill="#fef08a"/></svg><span style="margin-left:7px;">Web PSEditor</span>';
					brand.onclick = function (e) { e.preventDefault(); location.reload(); };
					menu.insertBefore(brand, menu.firstChild);
					return true;
				}
				return true;
			}

			// 2. 初始化执行与 MutationObserver 监听（替代原死循环 setInterval）
			ensureTopBrandBar();
			updateFooterLanguage();

			window.addEventListener('DOMContentLoaded', function () {
				ensureTopBrandBar();
				updateFooterLanguage();
			});

			window.addEventListener('load', function () {
				ensureTopBrandBar();
				updateFooterLanguage();
			});

			// 使用 MutationObserver 监听 main_menu 渲染，插入完成后即断开，零 CPU 持续消耗
			var menuContainer = document.getElementById('main_menu');
			if (menuContainer) {
				var menuObserver = new MutationObserver(function () {
					if (ensureTopBrandBar()) {
						menuObserver.disconnect();
					}
				});
				menuObserver.observe(menuContainer, { childList: true, subtree: true });
			}

			// 监听语言变更事件与点击交互，按需触发底栏翻译更新
			document.addEventListener('click', function (e) {
				if (e.target && (e.target.closest('#main_menu') || e.target.closest('#popups'))) {
					setTimeout(updateFooterLanguage, 100);
				}
			});
		})();
	</script>
</body>

</html>
