	<script>
		// 自动清理与自适应语言嗅探
		(function() {
			// 1. 若检测到旧的损坏 Cookie（带编码字符 %7B 等），立即自动清除并重写，防止普通模式老访客报错
			var match = document.cookie.match(/(?:^|;\s*)config=([^;]+)/);
			if (match && match[1]) {
				var rawVal = match[1];
				try {
					JSON.parse(rawVal);
				} catch (e) {
					// 旧 Cookie 已损坏，先清除
					document.cookie = "config=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT";
					try {
						// 尝试解码并修复，或直接设为正常中文
						var fixed = JSON.stringify(JSON.parse(decodeURIComponent(rawVal)));
						var d = new Date();
						d.setTime(d.getTime() + (180 * 24 * 60 * 60 * 1000));
						document.cookie = "config=" + fixed + ";path=/;expires=" + d.toUTCString();
					} catch (err) {
						var d = new Date();
						d.setTime(d.getTime() + (180 * 24 * 60 * 60 * 1000));
						document.cookie = "config=" + JSON.stringify({ language: 'zh' }) + ";path=/;expires=" + d.toUTCString();
					}
				}
			}

			// 2. 新访客：若未设置语言，且首选为中文，默认设为中文环境
			if (document.cookie.indexOf('config=') === -1 && window.location.search.indexOf('lang=') === -1) {
				var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
				if (lang.indexOf('zh') !== -1) {
					var d = new Date();
					d.setTime(d.getTime() + (180 * 24 * 60 * 60 * 1000));
					document.cookie = "config=" + JSON.stringify({ language: 'zh' }) + ";path=/;expires=" + d.toUTCString();
				}
			}
		})();
	</script>
	<script src="dist/bundle.js"></script>
</head>
<body>
	<div class="wrapper">

		<nav aria-label="Main Menu" class="main_menu" id="main_menu"></nav>
		
		<div class="submenu">
			<a class="logo" href="#">miniPaint</a>
			<div class="block attributes" id="action_attributes"></div>
			<button class="undo_button" id="undo_button" type="button">
				<span class="sr_only">Undo</span>

		</div>
		
		<div class="sidebar_left" id="tools_container"></div>


		<div class="middle_area" id="middle_area">

			<canvas class="ruler_left" id="ruler_left"></canvas>
			<canvas class="ruler_top" id="ruler_top"></canvas>

			<div class="main_wrapper" id="main_wrapper">

			</div>
			
			<div class="colors block">

				<div class="content" id="toggle_colors"></div>
			</div>
			
			<div class="block" id="info_base">

			</div>
			
			<div class="details block" id="details_base">

			<div class="layers block">

		</div>
	</div>
	<div class="mobile_menu">

	<!-- AdSense Compliance Bar: Centered in canvas bottom margin (safe from tools & layers) -->
	<footer id="adsense_compliance_bar" style="position: fixed; bottom: 0; left: 0; right: 0; height: 26px; line-height: 26px; z-index: 99; background: #25282a; border-top: 1px solid #383c40; text-align: center; font-size: 11px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
		<span style="color: #777; margin-right: 15px;">&copy; 2026 Web PSEditor</span>
		<a id="footer_link_guide" href="guide.html" target="_blank" style="color: #4da3ff; text-decoration: none; margin: 0 10px; font-weight: 500;">User Guide</a>
		<span style="color: #444;">|</span>
		<a id="footer_link_privacy" href="privacy.html" target="_blank" style="color: #aaa; text-decoration: none; margin: 0 10px;">Privacy Policy</a>
		<span style="color: #444;">|</span>
		<a id="footer_link_terms" href="terms.html" target="_blank" style="color: #aaa; text-decoration: none; margin: 0 10px;">Terms of Service</a>
	</footer>

	<script>
		// 监听/同步当前界面语言，保持底栏文本与编辑器语言一致
		(function() {
			function updateFooterLanguage() {
				var isZh = false;
				// 检查全局配置或cookie
				if (window.config && window.config.LANG) {
					isZh = (window.config.LANG === 'zh');
				} else if (document.cookie.indexOf('language=zh') !== -1 || document.cookie.indexOf('%22zh%22') !== -1 || document.cookie.indexOf('"zh"') !== -1) {
					isZh = true;
				} else if (document.cookie.indexOf('config=') === -1 && (navigator.language || '').toLowerCase().indexOf('zh') !== -1) {
					isZh = true;
				}

				var guideEl = document.getElementById('footer_link_guide');
				var privacyEl = document.getElementById('footer_link_privacy');
				var termsEl = document.getElementById('footer_link_terms');

				if (guideEl && privacyEl && termsEl) {
					if (isZh) {
						guideEl.innerText = '使用教程';
						privacyEl.innerText = '隐私政策';
						termsEl.innerText = '服务条款';
					} else {
						guideEl.innerText = 'User Guide';
						privacyEl.innerText = 'Privacy Policy';
						termsEl.innerText = 'Terms of Service';
					}
				}
			}

			// 页面加载和语言切换时同步更新
			window.addEventListener('DOMContentLoaded', updateFooterLanguage);
			window.addEventListener('load', updateFooterLanguage);
			setInterval(updateFooterLanguage, 800);
		})();
	</script>
</body>
